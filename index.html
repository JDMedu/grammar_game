<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문법의 나라</title>
<meta name="theme-color" content="#2f3557">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문법의 나라">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
:root{
  --ink:#231e1a; --paper:#f3e9d6; --paper2:#e4d5b7; --gold:#c9a04a; --navy:#2f3557;
  --red:#b5432f; --cel:#7fa393; --dim:#6d604f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1a1714;color:var(--ink);font-family:"Noto Serif KR",serif;overflow:hidden;
  display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;
  background:var(--paper) url(img/bg_hall.webp) center/cover;overflow:hidden}
#app.dungeon{background-image:url(img/bg_dungeon.webp)}
#app::before{content:"";position:absolute;inset:0;background:rgba(239,228,207,.45);pointer-events:none}
#app>*{position:relative}
#app>.screen,#app>.veil,#app>#flash,#app>#tut,#app>#toast{position:absolute}
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* 수치 */
#stats{display:flex;justify-content:space-around;padding:16px 6px 8px;background:var(--navy);border-bottom:3px solid var(--gold)}
.stat{position:relative;width:70px;text-align:center}
.icon{position:relative;width:60px;height:60px;margin:0 auto;border-radius:50%;overflow:hidden;background:#555;border:3px solid var(--gold)}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.4)}
.icon .fill{position:absolute;inset:0;overflow:hidden;transition:clip-path .5s}
.icon .fill img{filter:none}
.stat .lbl{font-size:14px;font-weight:700;color:var(--paper);margin-top:3px}
.dot{position:absolute;top:-13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:#ffe9a8;box-shadow:0 0 8px 2px #ffd36a;transform:scale(0);transition:transform .15s}
.dot.big{width:20px;height:20px;margin-left:-10px;top:-17px}
.dot.on{transform:scale(1)}
.stat.hot .icon{box-shadow:0 0 0 3px #ffe9a8,0 0 14px 4px #ffd36a}
.icon.up{animation:up .7s} .icon.down{animation:down .7s}
@keyframes up{30%{transform:scale(1.25);box-shadow:0 0 0 6px #9fd18b}}
@keyframes down{30%{transform:scale(.8);box-shadow:0 0 0 6px #e06a52}}

/* 대사 */
#q{flex:0 0 auto;margin:12px 14px 0;min-height:118px;display:flex;align-items:center;justify-content:center;
  padding:12px 16px;text-align:center;font-size:19px;font-weight:700;line-height:1.55;white-space:pre-line;color:var(--ink);
  background:rgba(243,233,214,.96);border:2px solid var(--gold);border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#q.small{font-size:17px}

/* 카드 */
#stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:10px}
#cardwrap{position:relative;width:min(72vw,300px,calc((100dvh - 360px)*.75));aspect-ratio:3/4;perspective:900px}
.back{position:absolute;inset:0;border-radius:14px;background:url(img/card_back.webp) center/cover;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#card{position:absolute;inset:0;border-radius:14px;background:var(--navy);border:3px solid var(--gold);
  box-shadow:0 8px 22px rgba(0,0,0,.4);overflow:hidden;touch-action:none;cursor:grab;transition:transform .25s ease-out}
#card.enter{animation:enter .35s ease-out}
@keyframes enter{from{transform:rotateY(90deg) scale(.92)}to{transform:none}}
#card.drag{transition:none;cursor:grabbing}
#card.fly{transition:transform .3s ease-in,opacity .3s}
#card::after{content:"";position:absolute;inset:6px;border:1px solid var(--gold);border-radius:9px;pointer-events:none}
#card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none;-webkit-user-drag:none}
#card.end{background:#000}
#card.end img{display:none}
#card.grammar{border-color:#e2bd62;box-shadow:0 0 0 3px #6b3a2a,0 8px 22px rgba(0,0,0,.4)}
#card.ok{box-shadow:0 0 0 5px #e9c45e,0 0 30px 10px #ffd36a}
#card.no{box-shadow:0 0 0 5px var(--red),0 0 30px 10px #e06a52}
#choice{position:absolute;left:0;right:0;top:0;min-height:28%;display:flex;align-items:center;padding:10px 18px;
  background:rgba(25,22,19,.9);color:#fff8e6;font-size:19px;font-weight:700;line-height:1.35;opacity:0;transition:opacity .1s}
#choice.r{justify-content:flex-start;text-align:left} #choice.l{justify-content:flex-end;text-align:right}
#who{margin-top:8px;font-family:"Song Myung",serif;font-size:24px;min-height:32px;color:var(--ink);
  background:rgba(243,233,214,.9);padding:0 14px;border-radius:14px}
#who:empty{background:none}

/* 연표 */
#bar{display:flex;justify-content:space-between;align-items:center;padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:var(--navy);color:var(--paper);border-top:3px solid var(--gold);font-size:15px}
#bar b{font-family:"Song Myung",serif;font-size:19px;font-weight:400}

/* 안내·알림 */
#tut{inset:0;z-index:4;display:none;pointer-events:none;background:rgba(20,17,14,.45)}
#tut.on{display:block}
#tut .box{position:absolute;left:16px;right:16px;bottom:64px;background:var(--paper);border:3px solid var(--gold);border-radius:14px;
  padding:14px 16px;font-size:18px;font-weight:700;line-height:1.6;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#tut .hand{font-size:40px;display:inline-block;animation:hand 1.4s ease-in-out infinite}
@keyframes hand{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
#toast{left:50%;top:96px;transform:translate(-50%,-30px);opacity:0;z-index:8;background:var(--navy);color:var(--paper);
  border:2px solid var(--gold);border-radius:20px;padding:8px 16px;font-size:15px;font-weight:700;white-space:nowrap;
  transition:transform .3s,opacity .3s;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#flash{inset:0;z-index:6;pointer-events:none;background:#b5241a;opacity:0}
#flash.on{animation:flash .7s}
#flash.gold{background:#ffd36a}
@keyframes flash{20%{opacity:.55}100%{opacity:0}}

/* 덮개 화면 */
.screen,.veil{inset:0;z-index:5;display:none;flex-direction:column;align-items:center;text-align:center;padding:20px;gap:12px}
.screen.on,.veil.on{display:flex}
#title{background:var(--paper) url(img/bg_cover.webp) center/cover;justify-content:space-between}
#title h1{font-family:"Song Myung",serif;font-size:50px;font-weight:400;color:var(--ink);margin-top:8vh;
  text-shadow:0 0 14px var(--paper),0 0 4px var(--paper)}
#panel{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;background:rgba(243,233,214,.94);
  border:2px solid var(--gold);border-radius:14px;padding:14px}
#panel fieldset{border:1px solid var(--gold);border-radius:10px;padding:6px 12px 10px;
  display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;text-align:left;font-size:16px}
#panel legend{padding:0 6px;font-weight:700}
#panel label{display:flex;gap:6px;align-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{position:relative;font:inherit;font-size:17px;font-weight:700;padding:10px 14px;border-radius:24px;border:2px solid var(--gold);
  background:var(--navy);color:var(--paper);cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn .new{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--paper)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.small{font-size:14px;color:var(--dim)}
#msg{color:var(--red);font-size:14px;min-height:18px;font-weight:700}
#death{background:#000;color:var(--paper);justify-content:center}
#death h2{font-family:"Song Myung",serif;font-size:36px;font-weight:400}
#death p{line-height:1.8;max-width:320px;font-size:17px}
.veil{background:#1d1a17;justify-content:flex-start;color:var(--paper)}
.veil h2{font-family:"Song Myung",serif;font-size:30px;font-weight:400;color:#f3d891;margin-top:6px}
.list{width:100%;max-width:400px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:left;touch-action:pan-y;padding-bottom:6px}
.item{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;border:2px solid transparent}
.item b{font-size:16px}
.item .d{font-size:14px;color:var(--dim);margin-top:2px}
.item.lock{opacity:.55}
.item.done{border-color:var(--gold)}
.item.done b::after{content:" ✓";color:#a37b1f}
.bar2{height:8px;background:#d8c7a6;border-radius:4px;margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold)}
.head{color:#f3d891;font-weight:700;font-size:17px;margin-top:6px;display:flex;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app" aria-label="문법의 나라">
  <div id="stats" role="group" aria-label="나라 형편"></div>
  <div id="q" aria-live="polite"></div>
  <div id="stage">
    <div id="cardwrap">
      <div class="back"></div>
      <div id="card" tabindex="0" aria-describedby="help"><img alt="" draggable="false"><div id="choice"></div></div>
    </div>
    <div id="who"></div>
  </div>
  <div id="bar"><span><b id="king"></b></span><span id="years"></span></div>
  <p id="help" class="sr">카드를 왼쪽이나 오른쪽으로 밀어 고릅니다. 키보드 왼쪽·오른쪽 화살표로도 고를 수 있습니다.</p>

  <div id="tut" aria-live="polite"><div class="box"><div id="tutText"></div><span class="hand" aria-hidden="true">👆</span></div></div>
  <div id="toast" role="status"></div>
  <div id="flash"></div>

  <section id="title" class="screen" aria-label="시작 화면">
    <h1>문법의 나라</h1>
    <div id="panel">
      <fieldset><legend>문법 단원</legend><div id="units" style="display:contents"></div></fieldset>
      <div id="msg" role="alert"></div>
      <div class="row">
        <button class="btn" id="btnNew">새로 시작</button>
        <button class="btn" id="btnCont" disabled>이어 하기</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnAch">도전과제</button>
        <button class="btn ghost" id="btnMis">오늘·이번 주 과제</button>
      </div>
      <button class="btn ghost" id="btnInstall" hidden>바탕화면에 두기</button>
      <label class="small" style="justify-content:center"><input type="checkbox" id="vibeOff"> 진동 끄기</label>
    </div>
  </section>

  <section id="death" class="screen" aria-live="assertive">
    <h2 id="dName"></h2><p id="dInfo"></p>
    <button class="btn" id="btnNext">다음 왕 즉위</button>
    <button class="btn ghost" id="btnHome">시작 화면으로</button>
  </section>

  <section id="vAch" class="veil" aria-label="도전과제">
    <h2>도전과제</h2><div class="small" id="achSum" style="color:#e9dcc0"></div>
    <div class="list" id="achList"></div>
    <button class="btn" data-close>닫기</button>
  </section>
  <section id="vMis" class="veil" aria-label="과제">
    <h2>과제</h2>
    <div class="list" id="misList"></div>
    <button class="btn" data-close>닫기</button>
  </section>
  <section id="vInstall" class="veil" aria-label="바탕화면에 두기" style="justify-content:center">
    <h2>바탕화면에 두기</h2>
    <p id="instBody" style="line-height:2;font-size:17px;max-width:320px"></p>
    <button class="btn" data-close>알겠다</button>
  </section>
</main>

<script src="grammar.js"></script>
<script src="dialogue.js"></script>
<script>
"use strict";
/* ================= 기본 자료 ================= */
const STATS = [
  {k:"문법", v:"spiritual",  img:"icon_munbeop"},
  {k:"민심", v:"demography", img:"icon_minsim"},
  {k:"군사", v:"military",   img:"icon_gunsa"},
  {k:"국고", v:"treasure",   img:"icon_gukgo"},
];
const NAMES = {diplomat:"사신",general:"대장군",priest:"대제학",jester:"광대",farmer:"농부",witch:"무녀",merchant:"보부상",
  dog:"검은 삽살개",nobleman:"대감",doctor:"의원",homunculus:"항아리 속 신선",queen:"중전",monk:"유생",lady:"규수",
  skeleton:"원귀",spy:"밀정",foreign_princess:"이웃 나라 공주",fortune_teller:"관상가",ghost:"선왕의 혼령",
  executioner:"망나니",minstrel:"소리꾼",prophet:"떠돌이 도사",bird:"까치",black_bird:"까마귀",cat:"고양이",
  parker:"고을 원님",courtesan:"떡 장인",barbare:"북방 족장",alien:"하늘 손님",painter:"화원",dragon:"이무기",
  werewolf:"구미호",explorator:"표류한 이방인",nun:"훈장",prince:"세자",rival:"처남",viking:"바다 도적",
  soldier:"병졸",anyone:"",senator:"그림자 정승",king:"왕",lover:"정인",dungeon:""};
const DEATH_NAME = {spiritual:["난종","엄종"],military:["애종","위종"],demography:["기종","민종"],treasure:["빈종","부종"]};
const PLAIN_NAMES = ["건종","율종","담종","찬종","운종","연종","보종","아종"];
const START_YEAR = 603, SAVE_KEY = "munbeop-nara-v1", META_KEY = "munbeop-nara-meta";
const GRAMMAR_GAP = 3;          // 이야기 카드 3장마다 문법 카드 1장 (4장에 1장)

/* 문법 카드에 붙는 수치 짝: 맞히면 그대로, 틀리면 부호가 반대 */
const G_PATTERNS = [
  {w:25, s:{문법:10}},
  {w:15, s:{문법:5, 민심:5}},
  {w:10, s:{문법:5, 군사:5}},
  {w:10, s:{문법:5, 국고:5}},
  {w:10, s:{문법:10, 국고:-5}},
  {w:15, s:{문법:5, 민심:5, 군사:-5}},
  {w:15, rescue:true},          // 가장 위험한 수치를 구한다
];

const CARDS = DIALOGUE.filter(c => !c.hold);
for (const c of CARDS) c.name = (c.name || "").trim();
const IDX = new Map(CARDS.map((c,i)=>[c.id,i]));
const BY_NAME = new Map();
for (const c of CARDS) if (c.name && c.name !== "_") {
  if (!BY_NAME.has(c.name)) BY_NAME.set(c.name, []);
  BY_NAME.get(c.name).push(c);
}
const DECK = CARDS.filter(c => !c.name.startsWith("_") && !(c.char||"").startsWith("end"));
const EFFECT_BY_TAG = new Map(EFFECTS.filter(e=>!e.hold).map(e=>[e.tag,e]));
const KEY_OF = Object.fromEntries(STATS.map(s=>[s.k,s.v]));
const NAME_OF = Object.fromEntries(STATS.map(s=>[s.v,s.k]));

/* ================= 저장 ================= */
let S = null, cur = null;
const skipped = new Set();
function newGame(units){
  S = {units, year:START_YEAR, dynasty:1, age:0, reignStart:START_YEAR,
       st:{spiritual:50,military:50,demography:50,treasure:50},
       vars:{}, seen:{}, queue:[], since:0, effects:{}, kings:[], rg:{right:0,all:0}};
}
function newReign(){
  for (const k of Object.keys(S.vars)) if (!/_keep$/.test(k) && !/^has_/.test(k)) delete S.vars[k];
  S.st = {spiritual:50,military:50,demography:50,treasure:50};
  S.age = 0; S.reignStart = S.year; S.queue = []; S.effects = {}; S.rg = {right:0,all:0};
  for (const k of Object.keys(S.seen)) if (S.seen[k] === "reign") delete S.seen[k];
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }

let META = {};
try{ META = JSON.parse(localStorage.getItem(META_KEY)) || {}; }catch(e){ META = {}; }
META.tot = META.tot || {}; META.ach = META.ach || {}; META.labels = META.labels || {}; META.unit = META.unit || {};
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }

/* ================= 조건·명령 해석 ================= */
function getVar(name){
  if (S && name in S.st) return S.st[name];
  switch(name){
    case "money": return S.st.treasure;
    case "year": return S.year;
    case "age": return S.age;
    case "dynasty": return S.dynasty;
    case "overall": return (S.st.spiritual+S.st.military+S.st.demography+S.st.treasure)/4;
  }
  const v = S.vars[name];
  return v === undefined ? 0 : (v === true ? 1 : v);
}
function test(cond){
  if (!cond) return true;
  for (let t of cond.split(/\s+and\s+/)){
    t = t.trim(); if (!t) continue;
    let m = t.match(/^(!?)([A-Za-z_]\w*)$/);
    if (m){ const v = getVar(m[2]); if (m[1] ? v : !v) return false; continue; }
    m = t.match(/^([A-Za-z_]\w*)\s*(<=|>=|<|>|=)\s*(-?[\d.]+)$/);
    if (m){
      const a = getVar(m[1]), b = Number(m[3]);
      const ok = m[2]==="<"?a<b : m[2]===">"?a>b : m[2]==="<="?a<=b : m[2]===">="?a>=b : a===b;
      if (!ok) return false; continue;
    }
    skipped.add(t); return false;
  }
  return true;
}
function run(cmd, card){
  if (!cmd) return;
  for (let t of cmd.split(/\s+and\s+/)){
    t = t.trim(); if (!t) continue;
    let m = t.match(/^(>+)(.*)$/);
    if (m){
      S.queue.push({after:m[1].length-1, from:card.id, label:m[2]});
      if (m[2]) META.labels[m[2].trim()] = 1;
      continue;
    }
    m = t.match(/^(add|del)_(\w+)$/);
    if (m){ S.vars["has_"+m[2]] = m[1]==="add"; continue; }
    m = t.match(/^!(\w+)$/);
    if (m){ delete S.vars[m[1]]; continue; }
    m = t.match(/^(\w+?)(\++|-+)$/);
    if (m){ const n = m[2].length*(m[2][0]==="+"?1:-1); S.vars[m[1]] = (Number(S.vars[m[1]])||0)+n; continue; }
    m = t.match(/^(\w+)$/);
    if (m){ S.vars[m[1]] = true; if (EFFECT_BY_TAG.has(m[1])) S.effects[m[1]] = Number(EFFECT_BY_TAG.get(m[1]).dur)||-1; continue; }
    skipped.add(t);
  }
}
function parseVal(s){
  s = String(s).trim();
  let m = s.match(/^(-?\d+)\?(-?\d+)$/);
  if (m){ const a=+m[1], b=+m[2]; return {n:Math.round(a+Math.random()*(b-a)), hide:true}; }
  m = s.match(/^\?(-?\d+)$|^(-?\d+)\?$/);
  if (m) return {n:+(m[1]??m[2]), hide:true};
  if (/^-?\d+$/.test(s)) return {n:+s, hide:false};
  skipped.add("값:"+s); return {n:0, hide:true};
}

/* ================= 카드 뽑기 ================= */
function available(c){
  const s = S.seen[c.id];
  if (s === "del" || s === "reign") return false;
  if (typeof s === "number" && S.year < s) return false;
  return test(c.cond);
}
function pickWeighted(list, wOf = c => c.weight === "max" ? 0 : (Number(c.weight) || 10)){
  const max = list.filter(c => c.weight === "max");
  if (max.length) return max[Math.floor(Math.random()*max.length)];
  const w = list.map(wOf);
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<list.length;i++){ r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length-1];
}
function resolveLabel(q){
  if (!q.label){ const i = IDX.get(q.from); return CARDS[i+1] || null; }
  const list = (BY_NAME.get(q.label.trim()) || []).filter(c => test(c.cond));
  return list.length ? pickWeighted(list) : null;
}
function atBound(){ return STATS.some(s => S.st[s.v] <= 0 || S.st[s.v] >= 100); }
function grammarCard(){
  const pool = GRAMMAR.filter(g => S.units.includes(g.u));
  if (!pool.length) return null;
  const g = pool[Math.floor(Math.random()*pool.length)];
  const pat = pickWeighted(G_PATTERNS, p => p.w);
  let eff;
  if (pat.rescue){                       // 50에서 가장 멀리 있는 수치
    const t = STATS.map(s => s.v).sort((a,b) => Math.abs(S.st[b]-50) - Math.abs(S.st[a]-50))[0];
    eff = {rescue:t};
  } else eff = {s:pat.s};
  return {kind:"grammar", g, isO: Math.random() < .5, eff};
}
function nextCard(){
  for (const q of S.queue) q.after--;
  const due = S.queue.findIndex(q => q.after < 0);
  if (due >= 0){
    const q = S.queue.splice(due,1)[0];
    const c = resolveLabel(q);
    if (c) return {kind:"story", card:c};
    if (q.label && !BY_NAME.has(q.label.trim())) skipped.add("이름표:"+q.label);
  }
  if (atBound()){
    const forced = CARDS.filter(c => /(spiritual|military|demography|treasure)=(0|100)/.test(c.cond) && test(c.cond)
      && !c.name.startsWith("_") && !(c.char||"").startsWith("end"));
    if (forced.length) return {kind:"story", card:pickWeighted(forced)};
    return {kind:"death"};
  }
  if (S.since >= GRAMMAR_GAP){
    const g = grammarCard();
    if (g){ S.since = Math.min(S.since - GRAMMAR_GAP, GRAMMAR_GAP*2); return g; }
  }
  const list = DECK.filter(available);
  return {kind:"story", card: list.length ? pickWeighted(list) : DECK[Math.floor(Math.random()*DECK.length)]};
}

/* ================= 글 다듬기 ================= */
function hasBatchim(ch){
  const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c-0xAC00)%28 !== 0;
  return /[136780lmnr]/i.test(ch);
}
const JOSA = {"이(가)":["이","가"],"가(이)":["이","가"],"은(는)":["은","는"],"는(은)":["은","는"],"을(를)":["을","를"],
  "를(을)":["을","를"],"과(와)":["과","와"],"와(과)":["과","와"],"(으)로":["으로","로"],"이(라)":["이라","라"],"아(야)":["아","야"]};
function fixJosa(t){
  return t.replace(/([가-힣A-Za-z0-9])(이\(가\)|은\(는\)|을\(를\)|과\(와\)|와\(과\)|를\(을\)|가\(이\)|는\(은\)|\(으\)로|이\(라\)|아\(야\))/g,(all,ch,j)=>{
    const p = JOSA[j]; if (!p) return all;
    if (j==="(으)로" && ch.charCodeAt(0)>=0xAC00 && (ch.charCodeAt(0)-0xAC00)%28===8) return ch+"로";
    return ch + (hasBatchim(ch) ? p[0] : p[1]);
  });
}
function fill(t){
  if (!t) return "";
  t = t.replace(/<(\w+)>/g,(all,k)=>{
    if (k==="dynasty") return String(S.year);
    if (k==="age") return String(S.age);
    return NAMES[k] !== undefined ? (NAMES[k] || "누군가") : all;
  });
  return fixJosa(t);
}

function choose(side){

  if (cur.kind === "explain" || cur.kind === "result"){ cur = null; return finishTurn(prev); }
  const c = cur.card, opt = side === "R" ? c.R : c.L;
  if ((c.char||"").startsWith("end")){ cur = {kind:"death", endCard:c}; return finishTurn(prev); }
  for (const [k,val] of Object.entries(opt.s || {})){
    const v = KEY_OF[k]; if (!v || lockedStat(v)) continue;
    S.st[v] += parseVal(val).n;
  }

  S.year++; S.age++; S.since++;

}
let justGrammar = false;
function chooseGrammar(side, prev){
  justGrammar = true;
  const right = (side === "R") === cur.isO, g = cur.g, eff = cur.eff;
  const sign = right ? 1 : -1;
  if (eff.rescue){
    const v = eff.rescue, d = S.st[v] >= 50 ? -1 : 1;     // 50 쪽 방향
    const amt = right ? Math.min(10, Math.abs(S.st[v]-50)) : 10;
    S.st[v] += right ? d*amt : -d*amt;
  } else {
    for (const [k,n] of Object.entries(eff.s)) if (!lockedStat(KEY_OF[k])) S.st[KEY_OF[k]] += sign*n;
  }
  S.year++; S.age++;
  S.rg.all++; if (right) S.rg.right++;
  bump("cards", 1); bump("gAll", 1);
  if (right){
    bump("gRight", 1); META.unit[g.u] = (META.unit[g.u]||0) + 1;
    META.streak = (META.streak||0) + 1; maxOf("gStreak", META.streak);
    vibe("right");
  } else { META.streak = 0; vibe("wrong"); shake(); }
  if (right){                                   // 맞히면 해설 없이 바로 다음 카드
    cur = null;
    toast("맞히셨사옵니다! " + changeLine(prev));
    const f = $("flash"); f.classList.remove("on","gold"); void f.offsetWidth; f.classList.add("on","gold");
    return finishTurn(prev);
  }
  cur = {kind:"explain", right, text:"아니옵니다, 전하.\n바르게 고치면: " + (cur.isO ? g.o : g.e) + "\n" + changeLine(prev)};
  finishTurn(prev);
}
function changeLine(prev){
  const up = [], down = [];
  for (const s of STATS){
    const a = prev[s.v], b = Math.max(0, Math.min(100, S.st[s.v]));
    if (b > a) up.push(s.k); else if (b < a) down.push(s.k);
  }
  const p = [];
  if (up.length) p.push(fixJosa(up.join("·") + "이(가) 올랐사옵니다"));
  if (down.length) p.push(fixJosa(down.join("·") + "이(가) 줄었사옵니다"));
  return p.length ? "(" + p.join(" / ") + ")" : "";
}
function lockedStat(v){
  for (const tag of Object.keys(S.effects)){
    const e = EFFECT_BY_TAG.get(tag); if (!e) continue;
    for (const [k,val] of Object.entries(e.yearly||{})) if (KEY_OF[k]===v && val==="lock") return true;
  }
  return false;
}
function yearlyEffects(){
  for (const tag of Object.keys(S.effects)){
    if (!S.vars[tag]){ delete S.effects[tag]; continue; }
    const e = EFFECT_BY_TAG.get(tag);
    for (const [k,val] of Object.entries(e.yearly||{})){
      const m = String(val).match(/^(-?[\d.]*\d)\*$/);
      if (m && KEY_OF[k]) S.st[KEY_OF[k]] += Number(m[1]);

  }
}
function finishTurn(prev){

  drawStats(prev);
  if (big >= 10 && !(cur && cur.kind === "explain") && !justGrammar){ vibe("big"); shake(); }

  justGrammar = false;
  maxOf("reignMax", S.age); maxOf("yearMax", S.year);

const pad = n => String(n).padStart(2,"0");
function dayKey(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekKey(d = new Date()){
  const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7));   // 월요일
  return dayKey(x);
}
function box(){
  const B = META.mis = META.mis || {};
  const dk = dayKey(), wk = weekKey();
  if (B.day !== dk){ B.day = dk; B.d = {}; B.dDone = []; }
  if (B.week !== wk){ B.week = wk; B.w = {}; B.wDone = []; B.wDays = []; B.wAll = 0; }
  if (!B.wDays.includes(dk)){ B.wDays.push(dk); B.w.days = B.wDays.length; }
  return B;
}
function bump(k, n){
  META.tot[k] = (META.tot[k]||0) + n;
  const B = box(); B.d[k] = (B.d[k]||0) + n; B.w[k] = (B.w[k]||0) + n;
  checkMis();
}
function maxOf(k, v){
  META.tot[k] = Math.max(META.tot[k]||0, v);
  const B = box(); B.d[k] = Math.max(B.d[k]||0, v); B.w[k] = Math.max(B.w[k]||0, v);
  checkMis();
}

  MK("w04","easy","카드 300장 넘기기","cards",300),
  MK("w05","easy","오늘의 과제 3개 끝내기","misDone",3),
  MK("w06","easy","문법 문답 연속 7번 맞히기","gStreak",7),
  MK("w07","mid","다섯 날에 걸쳐 게임하기","days",5),
  MK("w08","mid","문법 문답 60번 맞히기","gRight",60),
  MK("w09","mid","문법 문답 100번 맞히기","gRight",100),
  MK("w10","mid","왕 열 명 거치기","reigns",10),
  MK("w11","mid","카드 700장 넘기기","cards",700),
  MK("w12","mid","오늘의 과제 8개 끝내기","misDone",8),

  MK("w15","mid","도전과제 2개 열기","achOpen",2),
  MK("w16","mid","해동 1000년 넘기기","yearMax",1001),
];
function seed(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h<<13; h >>>= 0; h ^= h>>17; h ^= h<<5; h >>>= 0; return h/4294967296; };
}
const fam = k => k === "gRight" || k === "gAll" ? "g" : k;
function pickMis(pool, key, nEasy, nAll){
  const rnd = seed(key), used = new Set(), out = [];
  const take = (list, n) => {
    const a = list.slice(); let got = 0;
    while (got < n && a.length){
      const m = a.splice(Math.floor(rnd()*a.length),1)[0];
      if (used.has(fam(m.key))) continue;
      used.add(fam(m.key)); out.push(m); got++;
    }
  };
  take(pool.filter(m => m.hard === "easy"), nEasy);
  take(pool.filter(m => m.hard === "mid"), nAll - nEasy);
  return out;
}
const misToday = () => pickMis(DAILY, "d"+box().day, 1, 3);
const misWeek  = () => pickMis(WEEKLY, "w"+box().week, 2, 6);
function misNow(m, week){ const B = box(); return (week ? B.w : B.d)[m.key] || 0; }
let checkingMis = false;
function checkMis(){
  if (checkingMis) return; checkingMis = true;
  try{
    const B = box();
    for (const m of misToday()) if (!B.dDone.includes(m.id) && misNow(m,0) >= m.goal){
      B.dDone.push(m.id); toast("오늘의 과제 달성 · " + m.name); vibe("ach");
      B.w.misDone = (B.w.misDone||0) + 1; META.tot.misDone = (META.tot.misDone||0) + 1;
    }
    for (const m of misWeek()) if (!B.wDone.includes(m.id) && misNow(m,1) >= m.goal){
      B.wDone.push(m.id); toast("이번 주 과제 달성 · " + m.name); vibe("ach");
    }
    if (!B.wAll && B.wDone.length >= 6){ B.wAll = 1; toast("이번 주 과제를 모두 이루었사옵니다!"); }
  } finally { checkingMis = false; }
}
function renderMis(){
  const L = $("misList"); L.innerHTML = "";
  const B = box();
  const sect = (title, list, week, doneArr) => {
    const h = document.createElement("div"); h.className = "head";
    h.innerHTML = `<span>${title}</span><span>${doneArr.length} / ${list.length}</span>`; L.appendChild(h);
    for (const m of list){
      const now = Math.min(misNow(m,week), m.goal), done = doneArr.includes(m.id);
      const d = document.createElement("div"); d.className = "item" + (done ? " done" : "");
      d.innerHTML = `<b>${m.name}</b><div class="d">${now} / ${m.goal}</div><div class="bar2"><i style="width:${now/m.goal*100}%"></i></div>`;
      L.appendChild(d);
    }
  };
  sect("오늘", misToday(), 0, B.dDone);
  sect("이번 주", misWeek(), 1, B.wDone);
  const d = document.createElement("div"); d.className = "item" + (B.wAll ? " done" : "");
  d.innerHTML = `<b>이번 주 과제 여섯 개를 모두 이루기</b><div class="d">${B.wAll ? "이루었사옵니다" : "아직이옵니다"}</div>`;
  L.appendChild(d);
}

const UNIT_ACH = GRAMMAR_UNITS.map((u,i) => ({id:"u"+i, title:`${u}의 왕`, desc:`${u} 문답 30번 맞히기`, f:()=>(META.unit[u]||0) >= 30}));

  {id:"g04", title:"집현전의 벗", desc:"문법 문답 100번 맞히기", f:()=>(META.tot.gRight||0) >= 100},
  {id:"g05", title:"대제학의 스승", desc:"문법 문답 300번 맞히기", f:()=>(META.tot.gRight||0) >= 300},
  {id:"g06", title:"훈민의 왕", desc:"문법 문답 1000번 맞히기", f:()=>(META.tot.gRight||0) >= 1000},
  {id:"g07", title:"막힘없는 왕", desc:"문법 문답 연속 10번 맞히기", f:()=>(META.tot.gStreak||0) >= 10},
  {id:"g08", title:"한 치 어긋남 없는 왕", desc:"문법 문답 연속 20번 맞히기", f:()=>(META.tot.gStreak||0) >= 20},
  {id:"g09", title:"바른말의 왕", desc:"한 왕의 재위 동안 문법 문답 10번 이상을 모두 맞히기", f:()=>!!META.perfectReign},
  {id:"g10", title:"문답의 왕", desc:"문법 문답 500번 풀기", f:()=>(META.tot.gAll||0) >= 500},
  ...UNIT_ACH,
];
const O_ACH = GOALS.filter(g => !g.hold).map(g => ({id:"o_"+g.key, title:g.title, desc:g.desc, pre:g.pre ? "o_"+g.pre : "", cond:g.cond}));
const ACH = [...G_ACH, ...O_ACH];
function achOk(a){
  if (a.f) return a.f();
  if (!S) return false;
  if (a.pre && !META.ach[a.pre]) return false;
  const c = a.cond.trim();
  if (c.startsWith(">_")) return !!META.labels[c.slice(1)] || !!META.labels[c.slice(2)];
  return test(c);
}
function checkAch(){
  for (const a of ACH){
    if (META.ach[a.id]) continue;
    let ok = false; try{ ok = achOk(a); }catch(e){}
    if (ok){
      META.ach[a.id] = dayKey(); toast("도전과제 달성 · " + a.title); vibe("ach");
      bump("achOpen", 1);
    }
  }
}
function renderAch(){
  const L = $("achList"); L.innerHTML = "";
  const n = ACH.filter(a => META.ach[a.id]).length;
  $("achSum").textContent = `${n} / ${ACH.length} 달성`;
  for (const a of ACH){
    const got = META.ach[a.id];
    const d = document.createElement("div"); d.className = "item" + (got ? " done" : " lock");
    d.innerHTML = `<b>${got ? a.title : "잠긴 칭호"}</b><div class="d">${a.desc}</div>`;
    L.appendChild(d);
  }
}

/* ================= 바탕화면에 두기 ================= */
let instPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true
                        || location.search.indexOf("home=1") >= 0;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
addEventListener("beforeinstallprompt", e => { e.preventDefault(); instPrompt = e; });
addEventListener("appinstalled", () => { instPrompt = null; refreshInstall(); });
function refreshInstall(){ $("btnInstall").hidden = isStandalone(); }
function showInstall(){
  if (instPrompt){ const p = instPrompt; instPrompt = null; p.prompt(); return; }
  $("instBody").innerHTML = isIOS()
    ? `<b>하나</b> · 화면 아래 가운데 <b style="color:#f3d891">공유(⬆)</b> 단추를 누른다<br>
       <b>둘</b> · 아래로 내려 「홈 화면에 추가」를 누른다<br>
       <b>셋</b> · 오른쪽 위 「추가」를 누른다`
    : `<b>하나</b> · 브라우저 메뉴 <b style="color:#f3d891">⋮</b> 또는 <b style="color:#f3d891">☰</b> 를 누른다<br>
       <b>둘</b> · 「홈 화면에 추가」 또는 「앱 설치」를 누른다`;
  openVeil("vInstall");
}
function maybeOfferInstall(){                   // 세 번째로 들어왔을 때 평생 한 번만
  if (isStandalone() || META.instShown) return;
  META.visits = (META.visits||0) + 1;
  if (META.visits >= 3){ META.instShown = 1; setTimeout(showInstall, 900); }
  saveMeta();
}
$("btnInstall").onclick = showInstall;
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(()=>{});

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { b.closest(".veil").classList.remove("on"); refreshTitle(); });

}

  S = s; S.rg = S.rg || {right:0,all:0}; S.since = S.since || 0; start();
